name: Build Chikaku iOS IPA (AltStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for AltStore
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Chikaku-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Chikaku-iOS-IPA
          path: Chikaku-iOS.ipa
